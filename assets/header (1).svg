<svg viewBox="0 0 800 220" width="100%" height="220" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00e0a1"/>
    </linearGradient>

    <linearGradient id="waveGradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="waveGradB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00e0a1"/>
    </linearGradient>

    <filter id="textGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg-line { stroke:#4FACFE; stroke-width:0.6; opacity:0.14; }
      .pulse-line {
        stroke-dasharray: 8 12;
        animation: dashMove 5s linear infinite;
      }
      @keyframes dashMove { to { stroke-dashoffset: -200; } }

      .hex {
        fill:none; stroke:#00F2FE; stroke-width:1.1; opacity:0.32;
        transform-box: fill-box; transform-origin: center;
      }
      .hex-a { animation: spinCW 22s linear infinite; }
      .hex-b { animation: spinCCW 30s linear infinite; }
      @keyframes spinCW  { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
      @keyframes spinCCW { from{transform:rotate(0deg);} to{transform:rotate(-360deg);} }

      .diamond {
        fill:none; stroke:#4FACFE; stroke-width:1; opacity:0.3;
        transform-box: fill-box; transform-origin: center;
        animation: spinCCW 34s linear infinite;
      }

      .node {
        fill:#00F2FE; filter:url(#nodeGlow);
        transform-box: fill-box; transform-origin: center;
        animation: nodePulse 3s ease-in-out infinite;
      }
      @keyframes nodePulse {
        0%,100% { opacity:0.35; transform:scale(0.8); }
        50%     { opacity:1;    transform:scale(1.3); }
      }

      .title {
        font: 700 42px 'Segoe UI', Verdana, sans-serif;
        fill: #EAFBFF;
        text-anchor: middle;
      }
      .subtitle {
        font: 500 15px 'Fira Code', Consolas, monospace;
        fill: #00F2FE;
        text-anchor: middle;
        opacity: 0;
        animation: fadeUp 1s ease forwards 0.7s;
      }
      @keyframes fadeUp {
        from { opacity:0; transform: translateY(6px); }
        to   { opacity:1; transform: translateY(0); }
      }
      .cursor {
        fill: #4FACFE;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink { 50% { opacity:0; } }

      .wave-a { animation: driftA 9s ease-in-out infinite; }
      .wave-b { animation: driftB 13s ease-in-out infinite; }
      @keyframes driftA { 0%,100%{transform:translateX(0);} 50%{transform:translateX(-35px);} }
      @keyframes driftB { 0%,100%{transform:translateX(0);} 50%{transform:translateX(35px);}  }
    </style>
  </defs>

  <!-- background -->
  <rect width="800" height="220" fill="url(#bgGrad)"/>

  <!-- circuit grid lines -->
  <g>
    <line x1="0" y1="40"  x2="800" y2="40"  class="bg-line pulse-line"/>
    <line x1="0" y1="90"  x2="800" y2="90"  class="bg-line pulse-line" style="animation-delay:-2s"/>
    <line x1="0" y1="160" x2="800" y2="160" class="bg-line pulse-line" style="animation-delay:-3.5s"/>
    <line x1="120" y1="0" x2="120" y2="220" class="bg-line pulse-line" style="animation-delay:-1s"/>
    <line x1="680" y1="0" x2="680" y2="220" class="bg-line pulse-line" style="animation-delay:-4s"/>
  </g>

  <!-- floating wireframe hexagons -->
  <polygon class="hex hex-a" points="70,20 95,34 95,62 70,76 45,62 45,34" transform="translate(0,0)"/>
  <polygon class="hex hex-b" points="740,150 762,163 762,187 740,200 718,187 718,163"/>

  <!-- intersecting diamonds -->
  <rect class="diamond" x="30" y="140" width="34" height="34" transform="rotate(45 47 157)"/>
  <rect class="diamond" x="705" y="30" width="26" height="26" transform="rotate(45 718 43)"/>

  <!-- glowing nodes -->
  <circle class="node" cx="150" cy="55" r="2.4"/>
  <circle class="node" cx="640" cy="70" r="2" style="animation-delay:-1s"/>
  <circle class="node" cx="90" cy="175" r="2.2" style="animation-delay:-2s"/>
  <circle class="node" cx="600" cy="180" r="2.6" style="animation-delay:-0.6s"/>
  <circle class="node" cx="400" cy="30" r="1.8" style="animation-delay:-1.6s"/>

  <!-- title + subtitle -->
  <text x="400" y="100" class="title" filter="url(#textGlow)">Priya Kumari</text>
  <text x="400" y="132" class="subtitle">Software Development Engineer | GenAI, LLM Orchestration &amp; Full-Stack<tspan class="cursor">▎</tspan></text>

  <!-- layered bottom waves -->
  <g class="wave-a">
    <path d="M0,190 C100,170 200,210 300,190 C400,170 500,210 600,190 C700,170 800,210 900,190 L900,220 L0,220 Z"
          fill="url(#waveGradA)" opacity="0.22"/>
  </g>
  <g class="wave-b">
    <path d="M0,202 C100,188 200,216 300,202 C400,188 500,216 600,202 C700,188 800,216 900,202 L900,220 L0,220 Z"
          fill="url(#waveGradB)" opacity="0.35"/>
  </g>
  <path d="M0,192 C100,172 200,212 300,192 C400,172 500,212 600,192 C700,172 800,212 900,192"
        fill="none" stroke="url(#neonGrad)" stroke-width="1.4" opacity="0.6"/>
</svg>
