<svg width="100%" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16213e"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="waveGradF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e56cf"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <style>
      .waveF { animation: driftF 8s ease-in-out infinite; }
      @keyframes driftF {
        0%, 100% { transform: translateX(0); }
        50%      { transform: translateX(25px); }
      }
    </style>
  </defs>

  <rect width="1200" height="120" fill="url(#bgGradF)"/>

  <g class="waveF">
    <path d="M0,20 C150,50 300,-10 450,20 C600,50 750,-10 900,20 C1050,50 1200,-10 1350,20 L1350,0 L0,0 Z"
          fill="url(#waveGradF)" opacity="0.3"/>
  </g>
</svg>
