<svg viewBox="0 0 800 100" width="100%" height="100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C5364"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#0F2027"/>
    </linearGradient>

    <linearGradient id="waveGradFA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e0a1"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="waveGradFB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="neonGradF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00e0a1"/>
    </linearGradient>

    <style>
      .fwave-a { animation: fdriftA 9s ease-in-out infinite; }
      .fwave-b { animation: fdriftB 13s ease-in-out infinite; }
      @keyframes fdriftA { 0%,100%{transform:translateX(0);} 50%{transform:translateX(30px);}  }
      @keyframes fdriftB { 0%,100%{transform:translateX(0);} 50%{transform:translateX(-30px);} }

      .fnode {
        fill:#00F2FE; opacity:0.7;
        transform-box: fill-box; transform-origin: center;
        animation: fpulse 3s ease-in-out infinite;
      }
      @keyframes fpulse {
        0%,100% { opacity:0.25; transform:scale(0.8); }
        50%     { opacity:0.9;  transform:scale(1.2); }
      }
    </style>
  </defs>

  <rect width="800" height="100" fill="url(#bgGradF)"/>

  <!-- glowing top stroke line -->
  <path d="M0,14 C100,2 200,26 300,14 C400,2 500,26 600,14 C700,2 800,26 900,14"
        fill="none" stroke="url(#neonGradF)" stroke-width="1.4" opacity="0.65"/>

  <!-- ambient nodes -->
  <circle class="fnode" cx="80"  cy="30" r="1.8"/>
  <circle class="fnode" cx="420" cy="18" r="1.6" style="animation-delay:-1s"/>
  <circle class="fnode" cx="700" cy="34" r="2"   style="animation-delay:-2s"/>

  <!-- dual drifting waves -->
  <g class="fwave-a">
    <path d="M0,55 C100,35 200,75 300,55 C400,35 500,75 600,55 C700,35 800,75 900,55 L900,100 L0,100 Z"
          fill="url(#waveGradFA)" opacity="0.28"/>
  </g>
  <g class="fwave-b">
    <path d="M0,68 C100,54 200,82 300,68 C400,54 500,82 600,68 C700,54 800,82 900,68 L900,100 L0,100 Z"
          fill="url(#waveGradFB)" opacity="0.4"/>
  </g>
</svg>
