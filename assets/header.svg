<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#6e56cf"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title {
        font: 700 46px 'Segoe UI', Verdana, sans-serif;
        fill: #e0e0e0;
        text-anchor: middle;
      }
      .subtitle {
        font: 500 18px 'Fira Code', Consolas, monospace;
        fill: #00f0ff;
        text-anchor: middle;
        opacity: 0;
        animation: fadeIn 1.2s ease-in-out 0.6s forwards;
      }
      .cursor {
        fill: #00f0ff;
        animation: blink 1s step-end infinite;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      .wave {
        animation: drift 8s ease-in-out infinite;
      }
      @keyframes drift {
        0%, 100% { transform: translateX(0); }
        50%      { transform: translateX(-25px); }
      }
    </style>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <text x="600" y="95" class="title" filter="url(#glow)">Priya Kumari</text>
  <text x="600" y="135" class="subtitle">Software Development Engineer · GenAI &amp; Full-Stack<tspan class="cursor">▎</tspan></text>

  <g class="wave">
    <path d="M0,190 C150,160 300,220 450,190 C600,160 750,220 900,190 C1050,160 1200,220 1350,190 L1350,220 L0,220 Z"
          fill="url(#waveGrad)" opacity="0.25"/>
  </g>
  <g class="wave" style="animation-delay:-4s">
    <path d="M0,200 C150,175 300,225 450,200 C600,175 750,225 900,200 C1050,175 1200,225 1350,200 L1350,220 L0,220 Z"
          fill="url(#waveGrad)" opacity="0.4"/>
  </g>
</svg>
